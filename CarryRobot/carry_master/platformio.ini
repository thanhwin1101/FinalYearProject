; ====================================================================
;  Carry Robot – ESP32 Master
; ====================================================================
[common_libs]
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4
    olikraus/U8g2 @ ^2.35.19
    https://github.com/tzapu/WiFiManager.git

; ---- USB serial flash (first-time or when OTA not available) ------
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
lib_deps     = ${common_libs.lib_deps}

; ---- OTA flash (robot must be powered on & connected to WiFi) -----
; Usage:  pio run -e esp32dev-ota -t upload
;   Password prompt: ota123456
[env:esp32dev-ota]
platform        = espressif32
board           = esp32dev
framework       = arduino
monitor_speed   = 115200
upload_protocol = espota
upload_port     = AGV-01.local    ; or replace with the robot's IP
upload_flags    =
    --auth=ota123456
lib_deps        = ${common_libs.lib_deps}
